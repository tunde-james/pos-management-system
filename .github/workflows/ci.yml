name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-backend
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 25 with maven dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pos-backend/pom.xml
      
      - name: Run the full test suite
        run: ./mvnw clean test -B -ntp
      
      - name: Upload test reports (only when test fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: pos-backend/target/surefire-reports/**
          if-no-files-found: ignore


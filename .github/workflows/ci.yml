name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-backend
    
    steps:
      - name: Checkout sources
        uses:  actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 25 with maven dependency cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pos-backend/pom.xml
      
      - name: Run the full test suite
        run: ./mvnw clean test -B -ntp
      
      - name: Upload test reports (only when test fail)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: pos-backend/target/surefire-reports/**
          if-no-files-found: ignore

